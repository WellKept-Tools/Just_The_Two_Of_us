// 2. This or That: identical pair order; timeouts never count as agreements.
const binary={start(){screen(()=>`${heading('binary')}<div class="panel"><div class="eyebrow">FOLLOW YOUR INSTINCT</div><h2>Don't overthink it.</h2><p class="muted">Two choices. A ticking clock. One instinctive you.</p><label for="pairCount">How many questions?</label><select id="pairCount"><option>10</option><option>15</option><option>20</option></select><label for="seconds">Seconds per question</label><select id="seconds"><option>3</option><option selected>5</option><option>8</option></select>${btn('Ready, set, us',()=>{this.n=+$('#pairCount').value;this.secs=+$('#seconds').value;this.q=shuffle(PAIRS).slice(0,this.n);this.a=[[],[]];this.p=0;handOff(0,()=>this.countdown(),'binary')},'primary full','style="margin-top:24px"')}</div>`)},countdown(){this.i=0;const show=n=>{screen(()=>`${heading('binary')}<div class="handoff"><p class="eyebrow">${person(names[this.p])}, FOLLOW YOUR INSTINCT</p><div class="countdown" role="status">${n}</div><p class="muted">Your first choice is a good choice.</p></div>`);later(()=>n>1?show(n-1):this.ask(),800)};show(3)},ask(){let locked=false;screen(()=>`${heading('binary')}<div class="meta"><span>${person(names[this.p])} · ${this.i+1} / ${this.n}</span><span id="remaining" role="timer" aria-live="off">${this.secs}s</span></div><div class="progress"><i id="clockbar" style="--w:100%;background:var(--green)"></i></div><div class="center"><div class="eyebrow">THIS FEELS MORE LIKE ME</div><h2>This or that?</h2></div><div class="versus">${btn(this.q[this.i][0],()=>pick(0),'option')}<span class="vs">or</span>${btn(this.q[this.i][1],()=>pick(1),'option')}</div>`,'swipe');const pick=v=>{if(locked)return;locked=true;stop();this.a[this.p].push(v);this.i++;if(this.i<this.n)this.ask();else if(this.p===0){this.p=1;handOff(1,()=>this.countdown(),'binary')}else this.end()};const stop=timer(this.secs,left=>{$('#clockbar').style.width=left/this.secs*100+'%';$('#clockbar').style.background=left/this.secs>.5?'var(--green)':left/this.secs>.25?'#c18a37':'var(--red)';$('#remaining').textContent=Math.ceil(left)+'s'},()=>pick(null))},end(){let valid=0,hits=0;this.q.forEach((_,i)=>{if(this.a[0][i]!==null&&this.a[1][i]!==null){valid++;if(this.a[0][i]===this.a[1][i])hits++}});const pct=valid?Math.round(hits/valid*100):0;screen(()=>`${heading('binary')}<div class="panel center"><div class="eyebrow">FOLLOWING THE SAME SPARK</div>${ringHTML()}<h2>${valid?'You agreed on '+pct+'%':'No shared answers yet'}</h2><p class="muted">${hits} agreements out of ${valid} pairs you both answered.<br><span class="small">Timeouts are excluded from the percentage.</span></p><div class="results-list" style="text-align:left">${this.q.map((q,i)=>{const a=this.a[0][i],b=this.a[1][i],timeout=a===null||b===null;return `<div class="result-row ${timeout?'timeout':a===b?'agree':''}"><b>${q.join(' / ')}</b><div class="result-picks"><span>${person(names[0])}: ${a===null?'No answer':q[a]}</span><span>${person(names[1])}: ${b===null?'No answer':q[b]}</span></div></div>`}).join('')}</div>${endings(()=>this.start())}</div>`);animateRing(pct);if(pct>=70)confetti()}};

// 3. Deck: persist only card IDs; never repeat the most recent card.
const deck={cat:'Past',turn:0,last:null,current:null,start(){this.favs=storage.get('favs',[]);this.skip=storage.get('skip',[]);if(!Array.isArray(this.favs))this.favs=[];if(!Array.isArray(this.skip))this.skip=[];this.current=null;this.view()},cards(){return Object.entries(DECK).flatMap(([cat,qs])=>qs.map((q,i)=>({id:cat+i,cat,q})))},save(){storage.set('favs',this.favs);storage.set('skip',this.skip)},view(){const colors={Past:'#b58c3f',Present:'#568d7c',Future:'#9c78a8'},available=this.cards().filter(c=>c.cat===this.cat&&!this.skip.includes(c.id));screen(()=>`${heading('deck')}<div class="tabs" role="group" aria-label="Time category">${['Past','Present','Future'].map((c,i)=>btn(['⏳','🌿','🚀'][i]+' '+c,()=>{this.cat=c;this.current=null;this.view()},c===this.cat?'active':'','aria-pressed="'+(c===this.cat)+'"')).join('')}</div><div class="meta"><span>${available.length} cards left · ${this.skip.filter(id=>id.startsWith(this.cat)).length} skipped</span>${btn('♥ Favorites ('+this.favs.length+')',()=>this.favorites(),'textbtn','style="padding:0 6px"')}</div><div class="deck-stack" style="--tone:${colors[this.cat]}"><div class="deck-card"><div class="eyebrow">${this.cat.toUpperCase()} / ${this.current?'A MOMENT TO SHARE':'LET’S OPEN A CONVERSATION'}</div><h2 class="question">${this.current?this.current.q:'Some stories are<br>better shared.'}</h2><p class="small muted">${this.current?person(names[(this.turn-1)%2])+' answers first. Then switch.':'No points. No rush. Just the two of you.'}</p></div></div>${this.current?`<div class="actions">${btn(this.favs.includes(this.current.id)?'♥ Saved':'♡ Favorite',b=>{const id=this.current.id;this.favs.includes(id)?this.favs=this.favs.filter(x=>x!==id):this.favs.push(id);this.save();b.textContent=tr(this.favs.includes(id)?'♥ Saved':'♡ Favorite');b.classList.remove('heart-pop');void b.offsetWidth;b.classList.add('heart-pop')},'soft')}${btn('🚫 Skip forever',()=>{this.skip.push(this.current.id);this.save();$('.deck-card').classList.add('fly');later(()=>{this.current=null;this.draw()},280)},'soft')}</div>`:''}${btn(this.current?'Next card →':'Draw a card',()=>this.draw(),'primary full','style="margin-top:18px" '+(!available.length?'disabled':''))}<div class="actions">${btn('Reset skipped',()=>{this.skip=[];this.save();this.view()},'textbtn')}${btn('Finish conversation',()=>this.end(),'textbtn')}</div>`)},draw(){let a=this.cards().filter(c=>c.cat===this.cat&&!this.skip.includes(c.id)&&c.id!==this.last);if(!a.length){this.current=null;this.view();say('No new cards in this category. Try another category or reset skipped cards.');return}this.current=shuffle(a)[0];this.last=this.current.id;this.turn++;sound('draw');this.view()},favorites(){screen(()=>`${heading('deck')}<div class="panel"><div class="eyebrow">KEEP THESE CLOSE</div><h2>Your favorites</h2>${this.cards().filter(c=>this.favs.includes(c.id)).map(c=>`<div class="idea-row"><span class="eyebrow">${c.cat}</span><p>${c.q}</p>${btn('Remove favorite',()=>{this.favs=this.favs.filter(x=>x!==c.id);this.save();this.favorites()},'soft')}</div>`).join('')||'<p class="muted">A favorite conversation is waiting to happen. Draw a card and tap the heart.</p>'}${btn('Back to the deck',()=>this.view(),'primary full','style="margin-top:20px"')}</div>`)},end(){screen(()=>`${heading('deck')}<div class="panel center"><span class="bigemoji">🃏</span><h2>A little more<br>of your story.</h2><p class="muted">The best part is what you shared.</p>${endings(()=>this.start())}</div>`);confetti()}};

// 4. Balanced love language quiz: all ten unordered pairings, four exposures each.
const love={start(){this.q=shuffle(LANG.flatMap((_,i)=>LANG.slice(i+1).map((__,j)=>shuffle([i,i+j+1]))));this.scores=[Array(5).fill(0),Array(5).fill(0)];this.p=0;this.i=0;handOff(0,()=>this.ask(),'love')},ask(){screen(()=>`${heading('love')}<div class="meta"><span>${person(names[this.p])}'s turn</span><span>${this.i+1} / 10</span></div>${progress(this.i,10)}<div class="eyebrow">HOW CARE REACHES YOU</div><h2 class="question">Which would make you feel more loved?</h2><p class="muted">Choose what matters more to you right now.</p><div class="options">${this.q[this.i].map((v,j)=>btn(`<span class="letter">${j?'B':'A'}</span>${LANG[v].option}`,()=>{this.scores[this.p][v]++;this.i++;if(this.i<10)this.ask();else if(this.p===0){this.p=1;this.i=0;handOff(1,()=>this.ask(),'love')}else this.end()},'option')).join('')}</div>`,'swipe')},tops(p){const max=Math.max(...this.scores[p]);return this.scores[p].map((v,i)=>v===max?i:-1).filter(i=>i>=0)},end(){const shared=this.tops(0).some(v=>this.tops(1).includes(v));screen(()=>`${heading('love')}<div class="panel"><div class="eyebrow center">TWO WAYS TO FEEL LOVED</div><h2 class="center">${shared?'Same wavelength!':'Your little love map.'}</h2><p class="muted center small">A conversation starter about today’s preferences.</p><div class="duel">${names.map((n,p)=>`<div class="scorebox"><h3>${person(n)}</h3><span class="badge">${this.tops(p).length>1?'Joint favorites':'Top language'}</span><p class="small" style="margin:12px 0">${this.tops(p).map(i=>LANG[i].icon+' '+LANG[i].name).join('<br>')}</p>${LANG.map((l,i)=>`<div class="score-label"><span>${l.icon} ${l.name}</span><b data-score="${this.scores[p][i]}">0</b></div><div class="progress"><i class="langbar" data-width="${this.scores[p][i]*25}" style="--w:0%"></i></div>`).join('')}</div>`).join('')}</div>${names.map((n,p)=>`<div class="tips"><h3 style="font-size:25px">How ${person(names[1-p])} can love ${person(n)}</h3>${this.tops(p).map(i=>`<div class="eyebrow" style="margin-top:17px">${LANG[i].icon} ${LANG[i].name}</div><ol>${LANG[i].tips.map(t=>`<li>${t}</li>`).join('')}</ol>`).join('')}</div>`).join('')}<p class="note" style="margin-top:20px">Scores reflect ten choices, not a fixed identity. Each language can score up to 4. Keep asking what feels good.</p>${endings(()=>this.start())}</div>`);later(()=>document.querySelectorAll('.langbar').forEach(el=>el.style.width=el.dataset.width+'%'),60);document.querySelectorAll('[data-score]').forEach(el=>animateNumber(el,+el.dataset.score));if(shared)confetti()}};

// 5. Three gentle sets, touch navigation, and a pauseable four-minute timer.
const close={start(){this.i=0;this.elapsed=[0,0,0];this.showElapsed=false;screen(()=>`${heading('close')}<div class="panel"><div class="eyebrow">MAKE SPACE FOR US</div><h2>One question.<br>Two open hearts.</h2><p class="muted">An original guided conversation inspired by the gradual deepening of Arthur Aron's closeness exercise.</p><ol><li>Sit facing each other, somewhere comfortable.</li><li>Both answer every question. Alternate who starts.</li><li>Take your time: about 15 minutes per set of twelve.</li><li>Finish with four quiet minutes of eye contact.</li></ol><p class="note">You can pause, pass on a question, or stop whenever you like. This is shared time, not a test.</p><label><input type="checkbox" id="elapsedChoice" style="width:20px;min-height:20px;vertical-align:middle;margin-right:8px"> Show a gentle elapsed timer per set</label>${btn('Begin with the little things',()=>{this.showElapsed=$('#elapsedChoice').checked;this.ask()},'primary full','style="margin-top:20px"')}</div>`)},ask(){const set=Math.floor(this.i/12),moods=['THE LITTLE THINGS','WHAT MATTERS TO YOU','A LITTLE CLOSER'],tones=['#b58c3f','#ba8064','#ad4059'];this.setStarted=performance.now();screen(()=>`${heading('close')}<div style="--tone:${tones[set]}"><div class="meta"><span>Set ${['I','II','III'][set]} · Question ${this.i+1} / 36</span><span id="elapsed" role="timer" aria-live="off">${this.showElapsed?'0:00 elapsed':''}</span></div>${progress(this.i+1,36)}<div class="panel center" id="questionCard" style="border-color:${tones[set]}"><div class="eyebrow">${moods[set]}</div><h2 class="question">${CLOSE[this.i]}</h2><p class="muted small">${person(names[this.i%2])} answers first. Then switch.</p></div><div class="actions">${btn('← Back',()=>this.move(-1),'soft',this.i===0?'disabled':'')}${btn(this.i===35?'Eye-contact timer →':'Next →',()=>this.move(1),'primary')}</div><p class="swipehint">Both had your say? Move on when you’re ready.<br>Swipe left or right to turn the page.</p></div>`);if(this.showElapsed)every(()=>{const s=Math.floor(this.elapsed[set]+(performance.now()-this.setStarted)/1000);$('#elapsed').textContent=tr(Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' elapsed')},1000);let x=0,y=0;const card=$('#questionCard');card.addEventListener('touchstart',e=>{x=e.changedTouches[0].clientX;y=e.changedTouches[0].clientY},{passive:true});card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5&&(dx<0||this.i>0))this.move(dx<0?1:-1)},{passive:true})},move(d){const prev=Math.floor(this.i/12);this.elapsed[prev]+=(performance.now()-this.setStarted)/1000;if(this.i===35&&d===1){this.left=240;this.running=false;this.eye();return}this.i=Math.max(0,this.i+d);if(d===1&&Math.floor(this.i/12)!==prev)this.between();else this.ask()},between(){const set=Math.floor(this.i/12);screen(()=>`${heading('close')}<div class="handoff"><span class="bigemoji">${set===1?'🌿':'🕯️'}</span><div class="eyebrow">SET ${set===1?'II':'III'}</div><h2>${set===1?'What matters to you.':'A little closer.'}</h2><p class="muted">${set===1?'Values, memories, and the things that shaped you.':'Tender hopes, honest feelings, and your connection.'}<br>Take a breath. There’s no rush.</p>${btn('We’re ready',()=>this.ask(),'primary')}</div>`)},eye(){screen(()=>`${heading('close')}<div class="panel center"><div class="eyebrow">FOUR MINUTES, FULLY HERE</div><h2>A quiet kind<br>of connection.</h2><p class="muted">Look into each other's eyes in silence.<br>Get comfortable. Breathe naturally.</p><div class="ring breath" style="--p:${this.left/240*100}"><div class="ring-inner"><strong id="eyeClock" role="timer" aria-live="off">${this.format(this.left)}</strong><span class="small muted">just you two</span></div></div><p id="eyeMessage" aria-live="polite" class="muted small">${this.left?'Start when you both feel ready.':'Thank you for showing up for each other. ♥'}</p><div class="actions">${btn(this.running?'Pause':this.left?'Start':'Completed',()=>this.toggle(),'primary',!this.left?'disabled':'')}${btn('Reset',()=>{this.left=240;this.running=false;this.eye()},'soft')}</div>${endings(()=>this.start())}</div>`);if(this.running){const base=this.left;this.stopTimer=timer(base,left=>{this.left=left;$('#eyeClock').textContent=this.format(left);$('.ring').style.setProperty('--p',left/240*100)},()=>{this.left=0;this.running=false;this.eye();sound('bell');vibrate([50,50,50]);say('Four minutes complete. Thank you for showing up for each other.');$('#eyeMessage').classList.add('heart-pop')})}},format(s){s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},toggle(){this.running=!this.running;this.eye()}};

// 6. Date ratings stay in memory; final DOM contains mutual yeses only.
const yes={start(){this.custom=[];this.ideas=[...IDEAS];this.setup()},setup(){screen(()=>`${heading('yes')}<div class="panel"><div class="eyebrow">PLAN A LITTLE MAGIC</div><h2>Your next<br>“let’s do that.”</h2><p class="muted">Privately rate every idea. Only shared yeses make it to the reveal.</p><form id="ideaForm"><label for="customIdea">Add a date idea</label><input id="customIdea" maxlength="100" placeholder="Something you’d love to do together"><button class="soft full" style="margin-top:10px" type="submit">+ Add our idea</button></form><div class="chips">${this.custom.map((s,i)=>btn(person(s)+' ×',()=>{this.custom.splice(i,1);this.setup()},'chip','aria-label="Remove '+esc(s)+'"')).join('')}</div><details style="margin-top:20px"><summary>Explore the ${IDEAS.length} included ideas</summary><ol>${IDEAS.map(t=>`<li>${t}</li>`).join('')}</ol></details>${btn('Rate our ideas',()=>{this.ideas=[...IDEAS,...this.custom.map(t=>'✨ '+t)];this.r=[Array(this.ideas.length).fill(null),Array(this.ideas.length).fill(null)];this.p=0;handOff(0,()=>this.rate(),'yes')},'primary full','style="margin-top:24px"')}</div>`);$('#ideaForm').onsubmit=e=>{e.preventDefault();const t=$('#customIdea').value.trim();if(t){this.custom.push(t);this.setup()}}},rate(){screen(()=>`${heading('yes')}<div class="panel"><div class="eyebrow">${person(names[this.p])}'S PRIVATE PICKS</div><h2>Does it sound<br>like your kind of date?</h2><p class="muted small">Be honest. Only mutual yeses will be shown.</p>${this.ideas.map((t,i)=>`<div class="idea-row"><p>${ideaText(t)}</p><div class="segments" role="group" aria-label="${esc(t)}">${['✅ Yes','🤔 Maybe','❌ No'].map((v,j)=>btn(v,b=>{this.r[this.p][i]=j;b.parentElement.querySelectorAll('button').forEach(el=>{el.classList.remove('selected');el.setAttribute('aria-pressed','false')});b.classList.add('selected');b.setAttribute('aria-pressed','true');const n=this.r[this.p].filter(v=>v!==null).length;$('#rated').textContent=tr(n+' / '+this.ideas.length+' rated');$('#doneRating').disabled=n!==this.ideas.length},'','aria-pressed="false"')).join('')}</div></div>`).join('')}<div class="sticky"><div class="meta" style="margin:0 0 8px"><span id="rated" aria-live="polite">0 / ${this.ideas.length} rated</span><span>Just your picks</span></div>${btn('Done — keep my picks private',()=>{if(this.p===0){this.p=1;handOff(1,()=>this.rate(),'yes')}else this.drumroll()},'primary full','id="doneRating" disabled')}</div></div>`)},drumroll(){this.mutual=this.ideas.filter((_,i)=>this.r[0][i]===0&&this.r[1][i]===0);this.r=null;screen(()=>`${heading('yes')}<div class="handoff"><span class="bigemoji">🥁</span><div class="eyebrow">A LITTLE DRUMROLL...</div><h2>Meet in the middle.</h2><p class="muted">Finding the ideas that made you both say yes.</p></div>`);sound('draw');later(()=>this.end(),1700)},end(){screen(()=>`${heading('yes')}<div class="panel"><div class="eyebrow center">ONLY YOUR SHARED YESES</div><h2 class="center">${this.mutual.length?'Oh, the things<br>you could do.':'A fresh list,<br>a fresh possibility.'}</h2><p class="muted center">${this.mutual.length?'These are your little green lights.':'No shared yeses this time. Add a few new ideas that feel like you both, then try again.'}</p>${this.mutual.map((t,i)=>`<div class="mutual" style="--i:${i}">♥ &nbsp;${ideaText(t)}</div>`).join('')}${this.mutual.length?`<div id="slot" class="slot" style="display:none" aria-live="polite"></div>${btn('🎲 Pick one for us',b=>this.spin(b),'primary full','style="margin-top:16px"')}`:''}${endings(()=>this.start())}</div>`);if(this.mutual.length)confetti()},spin(b){b.disabled=true;const slot=$('#slot');slot.style.display='grid';let n=0;const id=every(()=>{slot.textContent=plainIdea(this.mutual[n%this.mutual.length]);n++;sound('draw');if(n>=18){clearInterval(id);slot.textContent=plainIdea(shuffle(this.mutual)[0]);b.disabled=false;confetti();sound('match');say('Your next date: '+slot.textContent)}},90)}};
const modules={mind,binary,deck,love,close,yes};
for(const game of Object.values(modules)){const start=game.start;game.start=function(...args){if(!demo.take())return;return start.apply(this,args)}}
installLocale();names?home():welcome();
</script></body></html>
